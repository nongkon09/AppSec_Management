name: appsec-management

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: appsec
      POSTGRES_PASSWORD: appsec
      POSTGRES_DB: appsec
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appsec -d appsec"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      APP_ENV: local
      SECRET_KEY: dev-only-change-me
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DATABASE_URL: postgresql+psycopg://appsec:appsec@postgres:5432/appsec
      DEPENDENCY_TRACK_BASE_URL: http://dtrack-apiserver:8080
      # Keys come from a git-ignored .env next to this file (see backend/.env.example).
      DEPENDENCY_TRACK_API_KEY: ${DEPENDENCY_TRACK_API_KEY:-}
      DEPENDENCY_TRACK_UPLOAD_API_KEY: ${DEPENDENCY_TRACK_UPLOAD_API_KEY:-}
      STALE_SBOM_DAYS: "90"
      # Entra ID sign-in and SCIM (docs/entra-id.md). Empty = off; values come from
      # the git-ignored .env. The API is on its own port in dev.
      APP_PUBLIC_URL: http://localhost:5173
      API_PUBLIC_URL: http://localhost:8000
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      SCIM_BEARER_TOKEN: ${SCIM_BEARER_TOKEN:-}
      LOCAL_LOGIN_ENABLED: ${LOCAL_LOGIN_ENABLED:-true}
      # FR-3.1: background Dependency-Track pull-sync + staleness sweep. Off by
      # default in dev (trigger POST /api/v1/sbom/sync manually instead); set to
      # "true" once dtrack-apiserver has real projects to sync against.
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-false}
      SBOM_SYNC_INTERVAL_HOURS: "6"
      STALE_CHECK_INTERVAL_HOURS: "24"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  dtrack-apiserver:
    image: dependencytrack/apiserver:latest
    restart: unless-stopped
    environment:
      ALPINE_DATABASE_MODE: external
      ALPINE_DATABASE_URL: jdbc:postgresql://postgres:5432/dtrack
      ALPINE_DATABASE_DRIVER: org.postgresql.Driver
      ALPINE_DATABASE_USERNAME: appsec
      ALPINE_DATABASE_PASSWORD: appsec
    ports:
      - "8081:8080"
    volumes:
      - dtrack_data:/data
    depends_on:
      postgres:
        condition: service_healthy

  dtrack-frontend:
    image: dependencytrack/frontend:latest
    restart: unless-stopped
    environment:
      API_BASE_URL: http://localhost:8081
    ports:
      - "8082:8080"
    depends_on:
      - dtrack-apiserver

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8083:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  dtrack_data:
