name: appsec-management

# Production stack: built images, no bind-mounted source, no dev-only services
# (Adminer). Dependency-Track is treated as an already-running external service
# (point DEPENDENCY_TRACK_BASE_URL/API_KEY at it) rather than bundled here — see
# README.md "Production Deployment".
#
# Required environment (create a `.env` next to this file, or export in your
# orchestrator): POSTGRES_PASSWORD, SECRET_KEY, CORS_ALLOWED_ORIGINS,
# DEPENDENCY_TRACK_BASE_URL, DEPENDENCY_TRACK_API_KEY. See backend/.env.example
# for the full list and defaults.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: appsec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: appsec
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appsec -d appsec"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY to a long random string}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set to the frontend's public origin}
      DATABASE_URL: postgresql+psycopg://appsec:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/appsec
      DEPENDENCY_TRACK_BASE_URL: ${DEPENDENCY_TRACK_BASE_URL:-}
      DEPENDENCY_TRACK_API_KEY: ${DEPENDENCY_TRACK_API_KEY:-}
      STALE_SBOM_DAYS: ${STALE_SBOM_DAYS:-90}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      SBOM_SYNC_INTERVAL_HOURS: ${SBOM_SYNC_INTERVAL_HOURS:-6}
      STALE_CHECK_INTERVAL_HOURS: ${STALE_CHECK_INTERVAL_HOURS:-24}
      WAIVER_EXPIRY_CHECK_INTERVAL_HOURS: ${WAIVER_EXPIRY_CHECK_INTERVAL_HOURS:-24}
      PENTEST_REPORT_UPLOAD_DIR: /app/uploads/pentest-reports
    volumes:
      # Pentest report uploads (FR-6.5.4) must survive container replacement.
      - pentest_reports:/app/uploads/pentest-reports
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  pentest_reports:
