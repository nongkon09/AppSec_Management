server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Never let the shell (index.html) be cached — every other asset is
    # content-hashed by Vite and safe to cache long-term.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Reverse-proxy API calls to the backend service on the same Compose network,
    # so the frontend never needs to know the backend's public hostname — see the
    # VITE_API_BASE_URL default in Dockerfile.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Passthrough so an external load balancer can health-check the API without
    # a direct route to the backend container.
    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # SPA fallback: client-side routing (react-router-dom) owns every other path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
